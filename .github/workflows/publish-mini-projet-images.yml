name: Publier les images du mini-projet

on:
  push:
    branches: [main]
    paths:
      - "mini-projet/infra/Dockerfile.airflow"
      - "mini-projet/infra/Dockerfile.garage-init"
      - ".github/workflows/publish-mini-projet-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Construire et publier (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Airflow
            image: ghcr.io/formateurdata/mini-projet-airflow
            dockerfile: mini-projet/infra/Dockerfile.airflow
            tag: "3.3.2"
          - name: Initialisation Garage
            image: ghcr.io/formateurdata/mini-projet-garage-init
            dockerfile: mini-projet/infra/Dockerfile.garage-init
            tag: "2.5.0"

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: mini-projet/infra
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ matrix.image }}:${{ matrix.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Image pédagogique du mini-projet CDC Lakehouse
