# Configuration volontairement simple pour la démonstration locale.
# Un vrai déploiement Garage répartirait les données sur plusieurs nœuds et zones.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

replication_factor = 1
rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
# Secret de démonstration uniquement ; ne jamais le réutiliser hors environnement local.
rpc_secret = "9f9acb5e5c8d9d11694f4a4b7d85c7eaa0c9f9b172a4e518be05fedc187ea3f7"
allow_world_readable_secrets = true

[s3_api]
api_bind_addr = "[::]:3900"
s3_region = "us-east-1"
public_endpoint = "http://garage:3900"
public_endpoint_path_style = true
